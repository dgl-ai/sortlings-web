server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx >= 1.21 incluye application/wasm en mime.types -> .wasm sirve con
    # Content-Type: application/wasm sin configuración extra.

    # gzip activo para wasm/pck/js/json (brotli no disponible en nginx stock)
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_vary on;
    gzip_proxied any;
    gzip_types
        application/wasm
        application/octet-stream
        application/javascript
        text/javascript
        application/json
        text/plain
        text/css;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(pck|wasm)$ {
        add_header Cache-Control "public, max-age=86400";
    }
}
